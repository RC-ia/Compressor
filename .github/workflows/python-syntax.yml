name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile scripts
        run: python -m py_compile analyze_weights.py compress_tensor.py formula_compress.py deep_tensor_experiment.py full_model_codec.py smoke_test_model.py formula_fit_layer.py nonlinear_formula_layer.py
      - name: Run codec tests
        run: python -m unittest discover -s tests -v
